<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

    <title>Glowmovies | Free Movies | Drug-store & GlowTV Private IPTV</title>
    <meta name="Glowmovies The Glow-Network" content="The best collection of Darkweb links, Movies, and GlowTV, IPTV Services, 24/7 ad free radio, and many more - content. Updated daily.">
    <link rel="icon" type="image/png" href="the-glow-network.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050509;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(to bottom, #050509 60%, transparent);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo {
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 20px;
      text-transform: uppercase;
      color: #ff3b6b;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #11131a;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #262938;
    }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #f5f5f5;
      width: 220px;
      font-size: 14px;
    }
    .search-bar button {
      background: #ff3b6b;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .search-bar button:hover {
      background: #ff5c84;
    }

    main {
      padding: 0 24px 40px;
    }

    /* Hero */
    .hero {
      position: relative;
      height: 55vh;
      min-height: 320px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 24px;
      background: radial-gradient(circle at top, #2b2f4a, #050509 60%);
      display: flex;
      align-items: flex-end;
      padding: 24px;
    }
    .hero-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.45);
      transform: scale(1.05);
    }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5,5,9,0.95), rgba(5,5,9,0.2));
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 60%;
    }
    .hero-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .hero-meta {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 10px;
    }
    .hero-overview {
      font-size: 14px;
      opacity: 0.9;
      max-height: 80px;
      overflow: hidden;
    }
    .hero-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-primary {
      background: #ff3b6b;
      border-radius: 999px;
      padding: 8px 16px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary:hover {
      background: #ff5c84;
    }
    .btn-secondary {
      background: rgba(15,17,26,0.9);
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid #303347;
      font-size: 13px;
      cursor: pointer;
      color: #f5f5f5;
    }
    .btn-secondary:hover {
      background: rgba(30,33,50,0.9);
    }

    /* Rows */
    .row {
      margin-bottom: 22px;
    }
    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .row-title {
      font-size: 18px;
      font-weight: 700;
    }
    .row-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .row-scroller::-webkit-scrollbar {
      height: 6px;
    }
    .row-scroller::-webkit-scrollbar-thumb {
      background: #262938;
      border-radius: 999px;
    }

    .card {
      flex: 0 0 auto;
      width: 140px;
      cursor: pointer;
    }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 10px;
      background: #151722;
      background-size: cover;
      background-position: center;
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
    }
    .card-poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .card-poster::after {
      opacity: 1;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .card-meta {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Player */
    .player-panel {
      margin-top: 18px;
      border-radius: 14px;
      background: #0b0d14;
      border: 1px solid #262938;
      padding: 12px 12px 16px;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .player-title {
      font-size: 15px;
      font-weight: 600;
    }
    .player-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      background: #11131a;
      border-radius: 999px;
      border: 1px solid #303347;
      color: #f5f5f5;
      font-size: 12px;
      padding: 4px 10px;
      outline: none;
    }
    .episode-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }
    .episode-controls input {
      width: 40px;
      background: #11131a;
      border-radius: 999px;
      border: 1px solid #303347;
      color: #f5f5f5;
      padding: 3px 6px;
      font-size: 12px;
      outline: none;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 420px;
      border-radius: 10px;
      border: none;
      background: #050509;
    }

    /* Search results */
    .search-results {
      margin-top: 18px;
    }
    .search-results-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .search-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-card {
      width: 140px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .hero {
        height: 46vh;
        min-height: 260px;
      }
      .hero-content {
        max-width: 100%;
      }
      .hero-title {
        font-size: 24px;
      }
      iframe {
        height: 260px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .search-bar input {
        width: 160px;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">GlowMovies</div>
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Search movies & shows..." />
    <button id="searchBtn">Search</button>
  </div>
</header>

<main>
  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-title" id="heroTitle">GlowMovies</div>
      <div class="hero-meta" id="heroMeta">Pick something and press play.</div>
      <div class="hero-overview" id="heroOverview">
        Clean UI, TMDB metadata, multiple servers, and pure chaos‑friendly watching.
      </div>
      <div class="hero-actions">
        <button class="btn-primary" id="heroPlayBtn">▶ Play</button>
        <button class="btn-secondary" id="heroMoreBtn">Details</button>
      </div>
    </div>
  </section>

  <!-- Player -->
  <section class="player-panel" id="playerPanel" style="display:none;">
    <div class="player-header">
      <div class="player-title" id="playerTitle">Now playing</div>
      <div class="player-controls">
        <select id="serverSelect">
          <option value="vidlink">Vidlink</option>
          <option value="multiembed">MultiEmbed</option>
        </select>
        <select id="contentTypeSelect">
          <option value="movie">Movie</option>
          <option value="tv">TV Show</option>
        </select>
        <div class="episode-controls" id="episodeControls" style="display:none;">
          <span>S</span><input type="number" id="seasonInput" min="1" value="1" />
          <span>E</span><input type="number" id="episodeInput" min="1" value="1" />
          <button class="btn-secondary" id="updateEpisodeBtn">Go</button>
        </div>
      </div>
    </div>
    <iframe id="playerFrame" src=""></iframe>
  </section>

  <!-- Rows -->
  <section class="row">
    <div class="row-header">
      <div class="row-title">Trending Movies</div>
    </div>
    <div class="row-scroller" id="rowTrendingMovies"></div>
  </section>

  <section class="row">
    <div class="row-header">
      <div class="row-title">Trending TV</div>
    </div>
    <div class="row-scroller" id="rowTrendingTV"></div>
  </section>

  <!-- Search results -->
  <section class="search-results" id="searchResults" style="display:none;">
    <div class="search-results-title">Search results</div>
    <div class="search-grid" id="searchGrid"></div>
  </section>
</main>

<script>
  const TMDB_KEY = "5378953b110dc4468b85ce936fbce1cc";
  const TMDB_BASE = "https://api.themoviedb.org/3";
  const IMG_BASE = "https://image.tmdb.org/t/p";

  let currentItem = null; // { id, type: 'movie'|'tv', title, backdrop_path }

  async function tmdbFetch(path, params = {}) {
    const url = new URL(TMDB_BASE + path);
    url.searchParams.set("api_key", TMDB_KEY);
    for (const [k, v] of Object.entries(params)) {
      url.searchParams.set(k, v);
    }
    const res = await fetch(url.toString());
    if (!res.ok) throw new Error("TMDB error");
    return res.json();
  }

  function buildPosterUrl(path, size = "w342") {
    if (!path) return "";
    return `${IMG_BASE}/${size}${path}`;
  }

  function buildBackdropUrl(path, size = "w1280") {
    if (!path) return "";
    return `${IMG_BASE}/${size}${path}`;
  }

  function setHeroFromItem(item, type) {
    currentItem = {
      id: item.id,
      type,
      title: item.title || item.name,
      backdrop_path: item.backdrop_path || item.poster_path
    };
    const titleEl = document.getElementById("heroTitle");
    const metaEl = document.getElementById("heroMeta");
    const overviewEl = document.getElementById("heroOverview");
    const backdropEl = document.getElementById("heroBackdrop");

    titleEl.textContent = currentItem.title || "Unknown title";
    const year = (item.release_date || item.first_air_date || "").slice(0, 4);
    const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";
    metaEl.textContent = `${type.toUpperCase()} • ${year || "Unknown"} • ★ ${rating}`;
    overviewEl.textContent = item.overview || "No overview available.";
    backdropEl.style.backgroundImage = currentItem.backdrop_path
      ? `url('${buildBackdropUrl(currentItem.backdrop_path)}')`
      : "none";
  }

  function openPlayerPanel() {
    if (!currentItem) return;
    const panel = document.getElementById("playerPanel");
    const titleEl = document.getElementById("playerTitle");
    const typeSelect = document.getElementById("contentTypeSelect");
    const episodeControls = document.getElementById("episodeControls");

    panel.style.display = "block";
    titleEl.textContent = `Now playing: ${currentItem.title}`;
    typeSelect.value = currentItem.type;
    episodeControls.style.display = currentItem.type === "tv" ? "flex" : "none";

    updatePlayerSrc();
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function updatePlayerSrc() {
    if (!currentItem) return;
    const frame = document.getElementById("playerFrame");
    const server = document.getElementById("serverSelect").value;
    const type = document.getElementById("contentTypeSelect").value;
    const season = parseInt(document.getElementById("seasonInput").value || "1", 10);
    const episode = parseInt(document.getElementById("episodeInput").value || "1", 10);

    let src = "";

    if (type === "movie") {
      if (server === "vidlink") {
        src = `https://vidlink.pro/movie/${currentItem.id}`;
      } else if (server === "multiembed") {
        src = `https://multiembed.mov/?video_id=${currentItem.id}&tmdb=1`;
      }
    } else if (type === "tv") {
      if (server === "vidlink") {
        src = `https://vidlink.pro/tv/${currentItem.id}/${season}/${episode}`;
      } else if (server === "multiembed") {
        src = `https://multiembed.mov/?video_id=${currentItem.id}&tmdb=1&s=${season}&e=${episode}`;
      }
    }

    frame.src = src;
  }

  function createCard(item, type) {
    const card = document.createElement("div");
    card.className = "card";
    const poster = document.createElement("div");
    poster.className = "card-poster";
    const posterUrl = buildPosterUrl(item.poster_path || item.backdrop_path);
    if (posterUrl) {
      poster.style.backgroundImage = `url('${posterUrl}')`;
    }
    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = item.title || item.name || "Unknown";

    const meta = document.createElement("div");
    meta.className = "card-meta";
    const year = (item.release_date || item.first_air_date || "").slice(0, 4);
    const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";
    meta.textContent = `${year || "Unknown"} • ★ ${rating}`;

    card.appendChild(poster);
    card.appendChild(title);
    card.appendChild(meta);

    card.addEventListener("click", () => {
      setHeroFromItem(item, type);
      openPlayerPanel();
    });

    return card;
  }

  async function loadTrending() {
    try {
      const [movies, tv] = await Promise.all([
        tmdbFetch("/trending/movie/week"),
        tmdbFetch("/trending/tv/week")
      ]);

      const rowMovies = document.getElementById("rowTrendingMovies");
      const rowTV = document.getElementById("rowTrendingTV");
      rowMovies.innerHTML = "";
      rowTV.innerHTML = "";

      movies.results.slice(0, 20).forEach(m => {
        rowMovies.appendChild(createCard(m, "movie"));
      });
      tv.results.slice(0, 20).forEach(t => {
        rowTV.appendChild(createCard(t, "tv"));
      });

      if (movies.results[0]) {
        setHeroFromItem(movies.results[0], "movie");
      } else if (tv.results[0]) {
        setHeroFromItem(tv.results[0], "tv");
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function doSearch() {
    const q = document.getElementById("searchInput").value.trim();
    const resultsSection = document.getElementById("searchResults");
    const grid = document.getElementById("searchGrid");

    if (!q) {
      resultsSection.style.display = "none";
      grid.innerHTML = "";
      return;
    }

    try {
      const [movies, tv] = await Promise.all([
        tmdbFetch("/search/movie", { query: q }),
        tmdbFetch("/search/tv", { query: q })
      ]);

      grid.innerHTML = "";
      const combined = [
        ...movies.results.map(r => ({ ...r, _type: "movie" })),
        ...tv.results.map(r => ({ ...r, _type: "tv" }))
      ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

      combined.slice(0, 30).forEach(item => {
        const card = document.createElement("div");
        card.className = "search-card";
        const poster = document.createElement("div");
        poster.className = "card-poster";
        const posterUrl = buildPosterUrl(item.poster_path || item.backdrop_path);
        if (posterUrl) {
          poster.style.backgroundImage = `url('${posterUrl}')`;
        }
        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = item.title || item.name || "Unknown";
        const meta = document.createElement("div");
        meta.className = "card-meta";
        const year = (item.release_date || item.first_air_date || "").slice(0, 4);
        const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";
        meta.textContent = `${item._type.toUpperCase()} • ${year || "Unknown"} • ★ ${rating}`;

        card.appendChild(poster);
        card.appendChild(title);
        card.appendChild(meta);

        card.addEventListener("click", () => {
          setHeroFromItem(item, item._type);
          openPlayerPanel();
        });

        grid.appendChild(card);
      });

      resultsSection.style.display = combined.length ? "block" : "none";
    } catch (e) {
      console.error(e);
    }
  }

  document.getElementById("searchBtn").addEventListener("click", doSearch);
  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });

  document.getElementById("heroPlayBtn").addEventListener("click", openPlayerPanel);
  document.getElementById("heroMoreBtn").addEventListener("click", () => {
    if (!currentItem) return;
    const url = `https://www.themoviedb.org/${currentItem.type}/${currentItem.id}`;
    window.open(url, "_blank");
  });

  document.getElementById("serverSelect").addEventListener("change", updatePlayerSrc);
  document.getElementById("contentTypeSelect").addEventListener("change", () => {
    const type = document.getElementById("contentTypeSelect").value;
    const episodeControls = document.getElementById("episodeControls");
    episodeControls.style.display = type === "tv" ? "flex" : "none";
    if (currentItem) currentItem.type = type;
    updatePlayerSrc();
  });
  document.getElementById("updateEpisodeBtn").addEventListener("click", updatePlayerSrc);

  loadTrending();
</script>
</body>
</html>
